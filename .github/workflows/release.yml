name: Release

# A tagged release (stage 60, Q-51; stage 76, ADR-36): pushing a tag v* packs every package into a tarball and the npm
# package @lgriffin/csh at the tag's version, installs each outside the repository and runs `csh analyse` from there,
# then attaches them all to a GitHub release of that tag. The npm package is published only when the repository has
# the owner's NPM_TOKEN secret, from the `npm` environment, which the owner may set to wait for their approval. Run by
# hand, it builds and tests the tarballs and keeps them as a workflow artifact, with no release and nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Pack and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Pack every package
        run: |
          node packages/testkit/src/pack.ts dist/packages
          name="csh-${GITHUB_REF_NAME//\//-}"
          tar -czf "dist/$name.tar.gz" -C dist packages
          echo "BUNDLE=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - name: Install the bundle outside the repository and analyse a repository with it
        run: |
          project=$(mktemp -d) subject=$(mktemp -d)
          tar -xzf "$BUNDLE" -C "$project"
          cp -r fixtures/F160/inputs/subject/. "$subject"
          git -C "$subject" init -q -b main && git -C "$subject" add -A
          git -C "$subject" -c user.name=ci -c user.email=ci@example.invalid -c commit.gpgsign=false commit -qm "the subject"
          cd "$project"
          npm init -y > /dev/null
          npm install --save-dev --no-audit --no-fund ./packages/*.tgz
          npx csh analyse "$subject" --out report
          test -f report/csh-analysis.json
      - name: Pack the npm package at the tag's version
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          case "$GITHUB_REF" in refs/tags/v*)
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "the tag $GITHUB_REF_NAME is not the version $version of packages/cli/package.json" >&2
              exit 1
            fi ;;
          esac
          node packages/testkit/src/npm-package.ts dist/npm --version "$version"
          echo "NPM_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install the npm package three ways and analyse a repository with each
        run: .github/scripts/npm-smoke.sh "dist/npm/lgriffin-csh-$NPM_VERSION.tgz" "$NPM_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: csh-tarballs
          path: dist/

  release:
    name: Release the tag
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: csh-tarballs
          path: dist
      - name: Create the release with the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "CSH $GITHUB_REF_NAME" --notes "Install with npm install --global @lgriffin/csh, then csh analyse <path>; the same package is attached here as lgriffin-csh-*.tgz. Every package of CSH is also attached, packed, as before. Needs Node 22.18 or later and git." dist/*.tar.gz dist/packages/*.tgz dist/npm/*.tgz

  publish:
    name: Publish to npm
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: csh-tarballs
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Publish @lgriffin/csh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret: nothing is published. The package is attached to the release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish dist/npm/lgriffin-csh-*.tgz --access public --provenance
