name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      # Full history: an A3 sheet resolves its quoted evidence at each stage's commit, so csh a3 build --check needs
      # those commits (packages/gate/csh/a3/dispositions).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Check tools
        run: |
          node --version
          git --version
          gpg --version | head -1
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p tsconfig.fixtures.json
      # Every sh block of the root README, in order (Anchor, harnesses and A3, section 11.1): both walkthroughs, the
      # starter installed from packed tarballs outside the repository, pnpm typecheck and pnpm test.
      - name: README commands
        run: node packages/testkit/src/triangle.ts readme

  # The same suite on Windows (From real runs, stage 41): paths with backslashes, CRLF checkouts and the sandbox's
  # permission model differ there, and the runs that found these were on Windows.
  windows:
    name: Windows (Node 22)
    runs-on: windows-latest
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Two workers keep the runner light enough that vitest's own worker messages arrive in time; the starter fixture
      # also awaits its subprocesses rather than blocking its worker for minutes.
      - run: pnpm test --maxWorkers=2

  # The gate of a component of the harness itself (Next layers, section 3.2): csh status, then, once the component has a
  # maintainers file, the enforcing run and the decision verified. CSH_ROOT_COMMIT is a repository variable, set by the
  # owner outside the repository; until it is set csh status reports the root as taken from history (A-28).
  gate:
    name: Gate (packages/gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate job
        run: .github/scripts/gate-job.sh packages/gate
        env:
          CSH_ROOT_COMMIT: ${{ vars.CSH_ROOT_COMMIT }}

  # The change review (Next layers, section 5.4): for each component, csh diff between the merge base and the head,
  # rendered to the job summary and kept as artifacts. Read access only; nothing is posted on the pull request (A-75).
  # It explains the gate job's decision and never fails on what the diff says.
  diff:
    name: Change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diff each component against the merge base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          .github/scripts/diff-job.sh packages/gate "$base" csh-diff/gate
          .github/scripts/diff-job.sh . "$base" csh-diff/workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csh-diff
          path: csh-diff/

  # The ESI.ts profile (Ingesting a codebase, stage 28): fetch ESI.ts at the pinned commit, which fails the job when the
  # fetch fails, run the profile, compare it with the committed expected results, then rebuild the prose-drift A3 from
  # one run per release and fail when the committed sheet differs. Nothing is written to ESI.ts.
  subject:
    name: Subject (ESI.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch ESI.ts at the pinned commit
        run: node packages/cli/bin/csh.js subject fetch --root subjects/esi-ts
      - name: Run the profile
        run: node packages/cli/bin/csh.js run --root subjects/esi-ts
      - name: Compare with the expected results
        run: node packages/cli/bin/csh.js expect --root subjects/esi-ts
      - name: Rebuild the prose-drift A3, one stage per release
        run: |
          node packages/cli/bin/csh.js history prose-drift --from v10.0.0 --to v11.3.0 --root subjects/esi-ts
          node packages/cli/bin/csh.js a3 build prose-drift --check --root subjects/esi-ts
          git diff --exit-code -- subjects/esi-ts/csh/a3/prose-drift
      - name: Overview
        if: always()
        run: node packages/cli/bin/csh.js overview --root subjects/esi-ts >> "$GITHUB_STEP_SUMMARY"

  # The polyglot profiles (Polyglot code, stage 36): one pinned public subject per language, each fetched at its pinned
  # commit, which fails the job when the fetch fails, run, and compared with its committed expected results. Nothing is
  # written to a subject. The ESI.ts job above stays as it was.
  polyglot:
    name: Subject (${{ matrix.subject }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subject: [fastapi-clean-example, spring-hexagonal-poc, go-clean-arch, hexarch, taskboard-typescript, taskboard-java, taskboard-python]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the subject at the pinned commit
        run: node packages/cli/bin/csh.js subject fetch --root subjects/${{ matrix.subject }}
      - name: Run the profile
        run: node packages/cli/bin/csh.js run --root subjects/${{ matrix.subject }}
      - name: Compare with the expected results
        run: node packages/cli/bin/csh.js expect --root subjects/${{ matrix.subject }}
      - name: Overview
        if: always()
        run: node packages/cli/bin/csh.js overview --root subjects/${{ matrix.subject }} >> "$GITHUB_STEP_SUMMARY"
