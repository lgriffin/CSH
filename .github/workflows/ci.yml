name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Check tools
        run: |
          node --version
          git --version
          gpg --version | head -1
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p tsconfig.fixtures.json
      # Every sh block of the root README, in order (Anchor, harnesses and A3, section 11.1): both walkthroughs, the
      # starter installed from packed tarballs outside the repository, pnpm typecheck and pnpm test.
      - name: README commands
        run: node packages/testkit/src/triangle.ts readme
