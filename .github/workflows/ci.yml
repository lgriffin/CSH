name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      # Full history: an A3 sheet resolves its quoted evidence at each stage's commit, so csh a3 build --check needs
      # those commits (packages/gate/csh/a3/dispositions).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Check tools
        run: |
          node --version
          git --version
          gpg --version | head -1
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p tsconfig.fixtures.json
      # Every sh block of the root README, in order (Anchor, harnesses and A3, section 11.1): both walkthroughs, the
      # starter installed from packed tarballs outside the repository, pnpm typecheck and pnpm test.
      - name: README commands
        run: node packages/testkit/src/triangle.ts readme

  # The gate of a component of the harness itself (Next layers, section 3.2): csh status, then, once the component has a
  # maintainers file, the enforcing run and the decision verified. CSH_ROOT_COMMIT is a repository variable, set by the
  # owner outside the repository; until it is set csh status reports the root as taken from history (A-28).
  gate:
    name: Gate (packages/gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate job
        run: .github/scripts/gate-job.sh packages/gate
        env:
          CSH_ROOT_COMMIT: ${{ vars.CSH_ROOT_COMMIT }}
