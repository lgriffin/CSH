name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      # Full history: an A3 sheet resolves its quoted evidence at each stage's commit, so csh a3 build --check needs
      # those commits (packages/gate/csh/a3/dispositions).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Check tools
        run: |
          node --version
          git --version
          gpg --version | head -1
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p tsconfig.fixtures.json
      # Every sh block of the root README, in order (Anchor, harnesses and A3, section 11.1): both walkthroughs, the
      # starter installed from packed tarballs outside the repository, pnpm typecheck and pnpm test.
      - name: README commands
        run: node packages/testkit/src/triangle.ts readme

  # The coverage floors (stage 65): the whole suite with V8 coverage, failing when the workspace or any package falls
  # below its floor in coverage-floors.json. The report is kept as an artifact and its totals go to the job summary.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -p tsconfig.fixtures.json
      - run: pnpm test:coverage
      - name: Totals
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            jq -r '"| | Lines | Statements | Functions | Branches |\n| --- | --- | --- | --- | --- |\n| Workspace | \(.total.lines.pct)% | \(.total.statements.pct)% | \(.total.functions.pct)% | \(.total.branches.pct)% |"' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # The same suite on Windows (From real runs, stage 41): paths with backslashes, CRLF checkouts and the sandbox's
  # permission model differ there, and the runs that found these were on Windows.
  windows:
    name: Windows (Node 22)
    runs-on: windows-latest
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # vitest.config.ts runs two workers on Windows (A-185), so this job runs the suite as a contributor's machine does.
      - run: pnpm test

  # The npm package (stage 76, ADR-36): packed as the release packs it, then installed globally, into a project and
  # through npx, each outside the repository, and run with no clone and no workspace. Kept as an artifact.
  npm:
    name: npm package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack the npm package
        run: node packages/testkit/src/npm-package.ts dist/npm --version 0.0.0-ci
      - name: Install it three ways and analyse a repository with each
        run: .github/scripts/npm-smoke.sh dist/npm/lgriffin-csh-0.0.0-ci.tgz 0.0.0-ci
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        with:
          name: npm-package
          path: dist/npm/

  # The gate of a component of the harness itself (Next layers, section 3.2): csh status, then, once the component has a
  # maintainers file, the enforcing run and the decision verified. CSH_ROOT_COMMIT is a repository variable, set by the
  # owner outside the repository; until it is set csh status reports the root as taken from history (A-28).
  gate:
    name: Gate (packages/gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate job
        run: .github/scripts/gate-job.sh packages/gate
        env:
          CSH_ROOT_COMMIT: ${{ vars.CSH_ROOT_COMMIT }}

  # The change review (Next layers, section 5.4): for each component, csh diff between the merge base and the head,
  # rendered to the job summary and kept as artifacts. Read access only; nothing is posted on the pull request (A-75).
  # It explains the gate job's decision and never fails on what the diff says.
  diff:
    name: Change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diff each component against the merge base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          .github/scripts/diff-job.sh packages/gate "$base" csh-diff/gate
          .github/scripts/diff-job.sh . "$base" csh-diff/workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csh-diff
          path: csh-diff/

  # The ESI.ts profile (Ingesting a codebase, stage 28): fetch ESI.ts at the pinned commit, which fails the job when the
  # fetch fails, run the profile, compare it with the committed expected results, then rebuild the prose-drift A3 from
  # one run per release and fail when the committed sheet differs. Nothing is written to ESI.ts.
  subject:
    name: Subject (ESI.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch ESI.ts at the pinned commit
        run: node packages/cli/bin/csh.js subject fetch --root subjects/esi-ts
      - name: Run the profile
        run: node packages/cli/bin/csh.js run --root subjects/esi-ts
      - name: Compare with the expected results
        run: node packages/cli/bin/csh.js expect --root subjects/esi-ts
      - name: Rebuild the prose-drift A3, one stage per release
        run: |
          node packages/cli/bin/csh.js history prose-drift --from v10.0.0 --to v11.3.0 --root subjects/esi-ts
          node packages/cli/bin/csh.js a3 build prose-drift --check --root subjects/esi-ts
          git diff --exit-code -- subjects/esi-ts/csh/a3/prose-drift
      - name: Overview
        if: always()
        run: node packages/cli/bin/csh.js overview --root subjects/esi-ts >> "$GITHUB_STEP_SUMMARY"

  # The polyglot profiles (Polyglot code, stage 36): one pinned public subject per language, each fetched at its pinned
  # commit, which fails the job when the fetch fails, run, and compared with its committed expected results. Nothing is
  # written to a subject. The ESI.ts job above stays as it was.
  polyglot:
    name: Subject (${{ matrix.subject }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subject: [fastapi-clean-example, spring-hexagonal-poc, go-clean-arch, hexarch, taskboard-typescript, taskboard-java, taskboard-python]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the subject at the pinned commit
        run: node packages/cli/bin/csh.js subject fetch --root subjects/${{ matrix.subject }}
      - name: Run the profile
        run: node packages/cli/bin/csh.js run --root subjects/${{ matrix.subject }}
      - name: Compare with the expected results
        run: node packages/cli/bin/csh.js expect --root subjects/${{ matrix.subject }}
      - name: Overview
        if: always()
        run: node packages/cli/bin/csh.js overview --root subjects/${{ matrix.subject }} >> "$GITHUB_STEP_SUMMARY"
      # csh analyse (stage 55): the same checkout read cold, with no profile, then through the profile; each must meet
      # its expected results. Neither writes into the checkout.
      - name: Analyse the subject cold
        run: |
          checkout="subjects/${{ matrix.subject }}/.csh-cache/subjects/$(jq -r .subject.commit subjects/${{ matrix.subject }}/csh/component.json)"
          before="$(git -C "$checkout" status --porcelain --ignored)"
          # Stage 60: a subject's analysis-expected.json is what the cold read must report, entry for entry and in count.
          expected=()
          if [ -f subjects/${{ matrix.subject }}/analysis-expected.json ]; then expected=(--expected subjects/${{ matrix.subject }}/analysis-expected.json); fi
          status=0
          node packages/cli/bin/csh.js analyse "$checkout" --out reports/analysis-cold "${expected[@]}" > analysis.txt || status=$?
          { echo '```'; cat analysis.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$before" = "$(git -C "$checkout" status --porcelain --ignored)"
          exit "$status"
      - name: Analyse the subject through its profile
        run: |
          checkout="subjects/${{ matrix.subject }}/.csh-cache/subjects/$(jq -r .subject.commit subjects/${{ matrix.subject }}/csh/component.json)"
          node packages/cli/bin/csh.js analyse "$checkout" --profile subjects/${{ matrix.subject }} --out reports/analysis-profile --json > analysis.json
          jq -e '.expect.mismatches == []' analysis.json

  action:
    # The Action (stage 60): this repository's action.yml, used as a workflow outside it would use it, on go-clean-arch
    # read cold, which must meet its analysis-expected.json.
    name: Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the subject at the pinned commit
        run: |
          node packages/cli/bin/csh.js subject fetch --root subjects/go-clean-arch
          echo "SUBJECT=subjects/go-clean-arch/.csh-cache/subjects/$(jq -r .subject.commit subjects/go-clean-arch/csh/component.json)" >> "$GITHUB_ENV"
      - id: csh
        uses: ./
        with:
          path: ${{ env.SUBJECT }}
          expected: subjects/go-clean-arch/analysis-expected.json
          out: reports/action
      - run: jq -e '.schema == "csh-analysis/v1"' "${{ steps.csh.outputs.json }}"

  # Labelled precision (The analysis A3 and 1.0, section 4; stage 79): each TypeScript subject fetched at the commit its
  # labels judge and read cold. `--labels` prints the precision by kind, and fails the job when an open entry is
  # unlabelled, a label names no entry, or a refuted entry is labelled false. Time and peak memory go to the summary.
  # Seeded drift (stage 80): each subject's drifts must all be reported, and an unrelated change must move no anchor.
  labelled:
    name: Labelled (${{ matrix.subject }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        subject: [esi-ts, tutors-mono-repo, taskboard, typescript-go]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the subject at the labelled commit
        run: |
          labels=evaluation/labels/${{ matrix.subject }}.json
          bash evaluation/fetch.sh "$(jq -r .subject.repo "$labels")" "$(jq -r .subject.commit "$labels")" checkout
      - name: Analyse cold and meet the labels
        run: bash evaluation/measure.sh checkout --labels evaluation/labels/${{ matrix.subject }}.json
      - name: Seed drift and find it
        run: node evaluation/drift.ts checkout evaluation/drifts/${{ matrix.subject }}.json

  # Experimental benchmarks (section 4): Java read cold on two large pinned repositories. Their counts, time and memory
  # are reported in the summary; they are not labelled and never fail the workflow.
  benchmark:
    name: Benchmark (${{ matrix.name }}, experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apache Camel 4.23.0
            repo: https://github.com/apache/camel
            commit: b2329103df8f5d1edfca2ad262be09e3be95ee68
          - name: Hadur_Robot
            repo: https://github.com/lgriffin/Hadur_Robot
            commit: 91a3abff73205bbe68609b6433b381b43d4ef9cd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the subject at the pinned commit
        run: bash evaluation/fetch.sh "${{ matrix.repo }}" "${{ matrix.commit }}" checkout
      - name: Analyse cold
        run: bash evaluation/measure.sh checkout
